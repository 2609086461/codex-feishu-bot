<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300">
  <rect width="1040" height="300" rx="20" fill="#f5f8ff"/><text x="30" y="39" font-size="22" font-family="sans-serif" font-weight="700" fill="#183153">图 6｜“更新”到底更新了什么？（概念示意）</text>
  <g font-family="sans-serif"><rect x="35" y="79" width="300" height="160" rx="17" fill="#e5f7ef" stroke="#68c298"/><text x="57" y="118" font-size="21" font-weight="700" fill="#183153">项目内容</text><text x="57" y="156" font-size="17" fill="#334c62">飞书发送“同步项目”</text><text x="57" y="189" font-size="16" fill="#47617d">只拉 Git 代码和文档</text><rect x="370" y="79" width="300" height="160" rx="17" fill="#dceaff" stroke="#79aaff"/><text x="392" y="118" font-size="21" font-weight="700" fill="#183153">机器人程序</text><text x="392" y="156" font-size="17" fill="#334c62">查看仓库 → 确认部署</text><text x="392" y="189" font-size="16" fill="#47617d">当前未实现自动 Release 提醒</text><rect x="705" y="79" width="300" height="160" rx="17" fill="#fff0d8" stroke="#e4b46d"/><text x="727" y="118" font-size="21" font-weight="700" fill="#183153">Codex CLI</text><text x="727" y="156" font-size="17" fill="#334c62">可选周检 → 提醒 → 你确认</text><text x="727" y="189" font-size="16" fill="#47617d">不会静默升级或重启</text><text x="38" y="275" font-size="16" fill="#5a6880">三条通道互不代替；电脑端 Codex 和服务器 Codex 也要分别更新。</text></g>
