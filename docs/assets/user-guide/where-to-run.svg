<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330">
  <rect width="1000" height="330" rx="20" fill="#f5f8ff"/><text x="30" y="40" font-size="22" font-family="sans-serif" font-weight="700" fill="#183153">图 2｜先选最终运行位置（选择示意）</text>
  <g font-family="sans-serif"><rect x="42" y="77" width="430" height="198" rx="18" fill="#e5f7ef" stroke="#68c298"/><text x="70" y="117" font-size="24" font-weight="700" fill="#183153">电脑本地</text><text x="70" y="153" font-size="18" fill="#334c62">启动快，适合先试用</text><text x="70" y="187" font-size="18" fill="#334c62">电脑关机 → 机器人停止回复</text><text x="70" y="221" font-size="18" fill="#334c62">本地项目仍需让容器能访问</text><rect x="528" y="77" width="430" height="198" rx="18" fill="#dceaff" stroke="#79aaff"/><text x="556" y="117" font-size="24" font-weight="700" fill="#183153">云服务器</text><text x="556" y="153" font-size="18" fill="#334c62">适合手机随时使用</text><text x="556" y="187" font-size="18" fill="#334c62">需独立认证、SSH 和网络</text><text x="556" y="221" font-size="18" fill="#334c62">本机项目需 Git 同步或迁移</text><text x="43" y="308" font-size="17" fill="#5a6880">可以在电脑上用 Codex 操作 SSH，把机器人部署到云端；操作地点 ≠ 最终运行地点。</text></g>
</svg>
