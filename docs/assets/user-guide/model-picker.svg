<svg xmlns="http://www.w3.org/2000/svg" width="950" height="375" viewBox="0 0 950 375">
  <rect width="950" height="375" rx="20" fill="#eef3fb"/><text x="30" y="39" font-size="22" font-family="sans-serif" font-weight="700" fill="#183153">图 4｜发送“模型”后的选择顺序（界面示意）</text>
  <rect x="37" y="78" width="260" height="238" rx="17" fill="#fff" stroke="#c9d8ef"/><text x="60" y="117" font-size="21" font-family="sans-serif" font-weight="700" fill="#183153">① 发送：模型</text><text x="60" y="154" font-size="17" font-family="sans-serif" fill="#47617d">机器人返回当前可用列表</text><text x="60" y="184" font-size="17" font-family="sans-serif" fill="#47617d">不是固定的模型白名单</text>
  <rect x="345" y="78" width="260" height="238" rx="17" fill="#fff" stroke="#c9d8ef"/><text x="368" y="117" font-size="21" font-family="sans-serif" font-weight="700" fill="#183153">② 选自动或模型</text><rect x="368" y="143" width="213" height="43" rx="11" fill="#dceaff"/><text x="384" y="171" font-size="17" font-family="sans-serif" fill="#183153">自动选择（推荐）</text><rect x="368" y="199" width="213" height="43" rx="11" fill="#e5f7ef"/><text x="384" y="227" font-size="17" font-family="sans-serif" fill="#183153">手动选择某模型</text>
  <rect x="653" y="78" width="260" height="238" rx="17" fill="#fff" stroke="#c9d8ef"/><text x="676" y="117" font-size="21" font-family="sans-serif" font-weight="700" fill="#183153">③ 如手动，再选强度</text><text x="676" y="154" font-size="17" font-family="sans-serif" fill="#47617d">轻 / 中 / 高 / 极高…</text><text x="676" y="187" font-size="17" font-family="sans-serif" fill="#47617d">以该模型实际支持为准</text><text x="676" y="225" font-size="16" font-family="sans-serif" fill="#47617d">下一项任务开始生效</text>
  <text x="40" y="351" font-size="15" font-family="sans-serif" fill="#5a6880">图中不列具体模型名，避免把当前账号能用的模型误认为所有人都能用。</text>
</svg>
