services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.162.1}
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-Asia/Shanghai}
      DEFAULT_WORKSPACE: /workspace
      CODEX_ARTIFACTS_DIR: /workspace/artifacts
      RUNTIME_STATE_FILE: /workspace/.codex-feishu-bot/runtime-state.json
      CODEX_MODE: app-server
      CODEX_APP_SERVER_COMMAND: /usr/local/bin/start-codex-app-server
      CODEX_APP_SERVER_ARGS: app-server
      CODEX_APP_SERVER_MANAGED: "true"
      CODEX_APP_SERVER_LISTEN_URL: ws://127.0.0.1:4500
      CODEX_APP_SERVER_MODEL: ${CODEX_APP_SERVER_MODEL:-auto}
      CODEX_APP_SERVER_APPROVAL_POLICY: never
      # Full access is limited to this unprivileged container and its explicit mounts.
      CODEX_APP_SERVER_SANDBOX: danger-full-access
      CODEX_HOME_DIR: /root/.codex
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FEISHU_PROVIDER: sdk
      FEISHU_TRANSPORT: websocket
      FEISHU_DOMAIN: ${FEISHU_DOMAIN:-feishu}
      FEISHU_APP_ID: ${FEISHU_APP_ID:?set FEISHU_APP_ID in .env.portable}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:?set FEISHU_APP_SECRET in .env.portable}
      FEISHU_APP_TOKEN: ${FEISHU_APP_TOKEN:-}
      MAIN_TABLE_ID: ${MAIN_TABLE_ID:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ALLOWED_OPEN_IDS: ${FEISHU_ALLOWED_OPEN_IDS:?set FEISHU_ALLOWED_OPEN_IDS in .env.portable}
      FEISHU_ALLOW_GROUP_MESSAGES: ${FEISHU_ALLOW_GROUP_MESSAGES:-false}
      QQ_MAIL_ADDRESS: ${QQ_MAIL_ADDRESS:-your-account@qq.com}
      QQ_MAIL_AUTH_CODE_FILE: /run/secrets/codex-mail/qq-imap-auth-code
      DOUBAO_SPEECH_CREDENTIALS_FILE: /run/secrets/codex-speech/doubao-asr.env
      XHS_MCP_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./.portable-data/workspace:/workspace
      - ./.portable-data/codex-home:/root/.codex
      - ./.portable-data/ssh:/root/.ssh:ro
      - ./.portable-data/mail:/run/secrets/codex-mail:ro
      - ./.portable-data/speech:/run/secrets/codex-speech:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
